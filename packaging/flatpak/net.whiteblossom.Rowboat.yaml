app-id: net.whiteblossom.Rowboat
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: rowboat

finish-args:
  # Display servers
  - --socket=wayland
  - --socket=fallback-x11
  # Audio
  - --socket=pulseaudio
  # IPC & Networking
  - --share=ipc
  - --share=network
  # GPU acceleration
  - --device=dri
  # Desktop notifications & secret portal
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  # File access for document analysis & downloads
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  # App data & config storage
  - --filesystem=~/.rowboat:create

modules:
  - name: rowboat
    buildsystem: simple
    build-commands:
      # Install application files
      - install -d /app/lib/rowboat
      - cp -r apps/x/apps/main/out/Rowboat-linux-x64/* /app/lib/rowboat/
      
      # Install launcher
      - install -D -m 755 packaging/flatpak/rowboat-launcher.sh /app/bin/rowboat
      
      # Install desktop file & icons
      - install -D -m 644 packaging/flatpak/net.whiteblossom.Rowboat.desktop /app/share/applications/net.whiteblossom.Rowboat.desktop
      - install -D -m 644 packaging/flatpak/net.whiteblossom.Rowboat.metainfo.xml /app/share/metainfo/net.whiteblossom.Rowboat.metainfo.xml
      - install -D -m 644 packaging/flatpak/icon-512.png /app/share/icons/hicolor/512x512/apps/net.whiteblossom.Rowboat.png
    sources:
      - type: dir
        path: ../..
